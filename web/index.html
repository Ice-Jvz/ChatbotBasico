<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot Universitario</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h2>Asistente Virtual 🤖</h2>
        </div>
        
        <div class="chat-messages" id="chat-messages">
            <div class="message bot-message">
                <p>¡Hola! Soy tu asistente virtual. ¿En qué puedo ayudarte hoy? (Ej. Pregunta por el horario, matrícula o contacto).</p>
            </div>
        </div>

        <div class="chat-input-area">
            <input type="text" id="user-input" placeholder="Escribe tu pregunta aquí..." autocomplete="off">
            <button id="send-btn">Enviar</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
